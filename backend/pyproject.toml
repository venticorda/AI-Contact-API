[tool.poetry]
name = "ai-contact-api"
version = "1.0.0"
description = "Production-grade AI-powered Contact API with sentiment analysis, rate limiting, and metrics"
authors = ["Developer"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.1"
loguru = "^0.7.3"
httpx = "^0.28.0"
openai = "^1.55.0"
resend = "^2.35.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"
ruff = "^0.8.0"
httpx = "^0.28.0"

[tool.poetry.scripts]
app = "app.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
