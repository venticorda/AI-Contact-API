name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установить зависимости
        run: pip install ruff pydantic-settings loguru httpx aiosqlite

      - name: Ruff линтер
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          pip install fastapi uvicorn pydantic pydantic-settings loguru \
            sqlalchemy httpx openai psycopg[binary,pool] aiosqlite \
            pytest pytest-asyncio

      - name: Запустить тесты
        run: python -m pytest -v --tb=short -q

      - name: Очистить test.db
        run: rm -f test.db
