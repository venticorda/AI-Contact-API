name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установить зависимости
        run: |
          pip install ruff aiosqlite
          pip install -e ".[dev]" 2>/dev/null || true

      - name: Ruff линтер
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установить зависимости
        run: |
          pip install httpx pytest pytest-asyncio aiosqlite
          pip install -e ".[dev]" 2>/dev/null || true

      - name: Запустить тесты
        run: python -m pytest -v --tb=short -q

      - name: Очистить test.db
        run: rm -f test.db
